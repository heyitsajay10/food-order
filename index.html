<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Play vs AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>♟ Chess Game</h1>
            <p class="subtitle">Play against AI</p>
        </header>
        
        <div class="game-container">
            <div class="game-info">
                <div class="status-panel">
                    <h2 id="game-status">White's Turn</h2>
                    <p id="game-message"></p>
                </div>
                
                <div class="controls">
                    <button id="restart-btn" class="btn btn-primary">🔄 Restart Game</button>
                </div>
                
                <div class="info-panel">
                    <h3>How to Play</h3>
                    <ul>
                        <li>Drag and drop pieces to move</li>
                        <li>Valid moves highlight in green</li>
                        <li>You play as White</li>
                        <li>AI plays as Black</li>
                    </ul>
                </div>
            </div>
            
            <div class="board-container">
                <div id="chessboard" class="chessboard"></div>
            </div>
            
            <div class="move-history">
                <h3>Move History</h3>
                <div id="history-list" class="history-list"></div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
</body>
</html>
